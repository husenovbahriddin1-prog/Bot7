services:
  - type: web
    name: buxprime-ai-controller
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: buxprime-db
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: PORT
        value: 10000

databases:
  - name: buxprime-db
    plan: basic-256mb
